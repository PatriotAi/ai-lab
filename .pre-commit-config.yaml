# Локальні перевірки перед комітом / local pre-commit checks.
# Встанови / install once: bash scripts/setup.sh
# Прогнати все / run all: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^melania-skills-ecosystem/'
      - id: end-of-file-fixer
        exclude: '^melania-skills-ecosystem/'
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        exclude: '^melania-skills-ecosystem/'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
