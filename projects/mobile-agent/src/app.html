<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Кишеньковий агент</title>
<link rel="manifest" href="__MANIFEST_DATA_URI__">
<link rel="icon" type="image/png" href="__ICON192_DATA_URI__">
<link rel="apple-touch-icon" href="__ICON192_DATA_URI__">
<style>
  :root{
    --bg:#0b0d0f; --surface:#14181c; --surface-2:#1c2126; --line:#2a3138;
    --ink:#eef2f4; --ink-dim:#93a1ab; --accent:#d4ff4f; --accent-ink:#12160a;
    --warn:#ffb020; --err:#ff6b5e; --radius:16px;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 ui-sans-serif,"Inter","Segoe UI Variable","Segoe UI",Roboto,system-ui,sans-serif;
    display:flex;flex-direction:column;overscroll-behavior:none;
  }
  header{
    display:flex;align-items:center;gap:10px;padding:14px 16px 12px;
    border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5;
  }
  .brand{font-weight:700;letter-spacing:-.02em;font-size:17px;flex:1;min-width:0}
  .brand small{display:block;font-weight:400;font-size:11px;color:var(--ink-dim);letter-spacing:.04em}
  .chip{
    font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-dim);white-space:nowrap;cursor:pointer;
  }
  .chip.cloud{color:#8fd8ff;border-color:#28414f}
  .chip.local{color:var(--accent);border-color:#3d4a1f}
  .chip.offline{color:var(--warn);border-color:#4a3a17}
  .icon-btn{
    width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:17px;cursor:pointer;
  }
  #banner{display:none;padding:10px 16px;background:#20301a;border-bottom:1px solid #3d4a1f;
    font-size:14px;align-items:center;gap:10px}
  #banner.on{display:flex}
  #banner button{margin-left:auto;background:var(--accent);color:var(--accent-ink);border:0;
    padding:7px 12px;border-radius:10px;font-weight:600;cursor:pointer}
  .searchbar{padding:10px 16px 4px}
  .searchbar input{
    width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:15px;
  }
  main{flex:1;overflow-y:auto;padding:8px 16px 16px;-webkit-overflow-scrolling:touch}
  .note{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;margin:10px 0;
  }
  .note.task{border-left:3px solid var(--accent)}
  .note .meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--ink-dim);margin-bottom:7px}
  .note .meta .badge{border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  .note .q{font-weight:600;margin-bottom:6px;white-space:pre-wrap;word-break:break-word}
  .note .a{white-space:pre-wrap;word-break:break-word;color:#cdd7dd;font-size:15px}
  .note .tags{margin-top:8px;font-size:12px;color:var(--accent)}
  .note .del{float:right;background:none;border:0;color:var(--ink-dim);cursor:pointer;font-size:15px}
  .empty{color:var(--ink-dim);text-align:center;padding:48px 20px;font-size:14px}
  .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:8px}
  footer{
    border-top:1px solid var(--line);background:var(--bg);
    padding:10px 12px calc(10px + var(--safe-b));display:flex;gap:8px;align-items:flex-end;
  }
  #input{
    flex:1;min-height:46px;max-height:140px;resize:none;padding:12px 14px;border-radius:14px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;
  }
  #send{
    width:46px;height:46px;flex:none;border-radius:14px;border:0;background:var(--accent);
    color:var(--accent-ink);font-size:19px;font-weight:700;cursor:pointer;
  }
  #send:disabled{opacity:.45}
  dialog{
    border:0;border-radius:18px 18px 0 0;background:var(--surface);color:var(--ink);
    padding:0;width:100%;max-width:560px;margin:auto auto 0;
  }
  dialog::backdrop{background:#000a}
  .sheet{padding:18px 18px calc(18px + var(--safe-b))}
  .sheet h2{margin:0 0 14px;font-size:17px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:6px}
  .field input,.field select{
    width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink);font-size:15px;
  }
  .row{display:flex;gap:8px}
  .btn{
    padding:11px 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);
    color:var(--ink);font-size:14px;cursor:pointer;flex:1;
  }
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  .hint{font-size:12px;color:var(--ink-dim);margin-top:-6px;margin-bottom:14px}
  .hint.err{color:var(--err)}
  .qstatus{padding:0 16px;font-size:12px;color:var(--ink-dim);min-height:0}
  .qstatus:not(:empty){padding:6px 16px 0}
  .qstatus.err{color:var(--err)}
  .queuebox{display:none}
  .queuebox.on{display:block;padding:8px 16px 0}
  .qitem{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px dashed var(--line);
    border-radius:12px;padding:9px 12px;margin-bottom:6px;font-size:13px}
  .qitem.failed{border-style:solid;border-color:#5a2a26}
  .qtext{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qmeta{color:var(--ink-dim);font-size:11px;white-space:nowrap}
  .qretry{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;
    padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer}
  #toast{
    position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--surface-2);
    border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:14px;
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center;
  }
  #toast.on{opacity:1}
  .spin{display:inline-block;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="brand">Кишеньковий агент<small>ai-lab · projects/mobile-agent</small></div>
  <button class="chip" id="engineChip" title="Двигун">…</button>
  <button class="icon-btn" id="openSettings" aria-label="Налаштування">⚙</button>
</header>

<div id="banner">
  <span id="bannerText">Доступне оновлення</span>
  <button id="applyUpdate">Оновити</button>
</div>

<div class="searchbar"><input id="search" type="search" placeholder="Пошук у нотатках…" autocomplete="off"></div>
<div class="qstatus" id="queueStatus"></div>
<div class="queuebox" id="queue"></div>

<main id="list"></main>

<footer>
  <textarea id="input" rows="1" placeholder="Запитай, або «+» для задачі…"></textarea>
  <button class="icon-btn" id="mic" aria-label="Голос">🎤</button>
  <button id="send" aria-label="Надіслати">➤</button>
</footer>

<div id="toast"></div>

<dialog id="settings"><div class="sheet">
  <h2>Налаштування</h2>

  <div class="field">
    <label for="prefer">Двигун</label>
    <select id="prefer">
      <option value="auto">Авто (хмара → локальна → офлайн)</option>
      <option value="cloud">Тільки хмара</option>
      <option value="local">Тільки локальна (WebGPU)</option>
      <option value="offline">Тільки офлайн (без моделі)</option>
    </select>
  </div>

  <div class="field">
    <label for="provider">Провайдер</label>
    <select id="provider">
      <option value="anthropic">Anthropic (Claude)</option>
      <option value="openai">OpenAI-сумісний</option>
    </select>
  </div>

  <div class="field">
    <label for="model">Модель (хмара)</label>
    <input id="model" type="text" spellcheck="false" autocomplete="off">
  </div>

  <div class="field">
    <label for="apikey">API-ключ (шифрується на пристрої)</label>
    <input id="apikey" type="password" placeholder="лишається лише у твоєму телефоні" autocomplete="off">
  </div>
  <div class="field">
    <label for="passphrase">Пароль-фраза для ключа</label>
    <input id="passphrase" type="password" placeholder="потрібна щоб зашифрувати/відкрити" autocomplete="off">
  </div>
  <div class="hint" id="keyHint">Ключ шифрується AES-GCM (PBKDF2-SHA256) і зберігається лише тут. У репозиторії ключів нема.</div>
  <div class="row" style="margin-bottom:14px">
    <button class="btn" id="saveKey">Зберегти ключ</button>
    <button class="btn" id="unlockKey">Відкрити</button>
    <button class="btn" id="forgetKey">Забути</button>
  </div>

  <div class="field">
    <label for="backupProvider">Запасний провайдер (вмикається, коли основний падає)</label>
    <select id="backupProvider">
      <option value="">— немає —</option>
      <option value="openai">OpenAI-сумісний</option>
      <option value="anthropic">Anthropic (Claude)</option>
    </select>
  </div>
  <div class="field">
    <label for="backupModel">Модель запасного</label>
    <input id="backupModel" type="text" spellcheck="false" autocomplete="off" placeholder="напр. gpt-4o-mini">
  </div>
  <div class="field">
    <label for="backupBaseUrl">Базовий URL запасного (для OpenAI-сумісних)</label>
    <input id="backupBaseUrl" type="url" spellcheck="false" autocomplete="off" placeholder="https://…/v1">
  </div>
  <div class="field">
    <label for="backupApikey">Ключ запасного (шифрується тією ж пароль-фразою)</label>
    <input id="backupApikey" type="password" autocomplete="off" placeholder="лишається лише у твоєму телефоні">
  </div>

  <div class="field">
    <label for="ram">Пам'ять пристрою, ГБ (Chrome показує максимум 8)</label>
    <input id="ram" type="number" min="1" max="64" step="1" placeholder="авто">
  </div>
  <div class="row" style="margin-bottom:14px">
    <button class="btn" id="loadLocal">Завантажити локальну модель</button>
  </div>
  <div class="hint" id="localHint"></div>

  <div class="field">
    <label for="updateUrl">URL version.json (авто-оновлення)</label>
    <input id="updateUrl" type="url" spellcheck="false" placeholder="https://…/version.json" autocomplete="off">
  </div>
  <div class="row" style="margin-bottom:14px">
    <button class="btn" id="checkUpdate">Перевірити оновлення</button>
  </div>

  <div class="row">
    <button class="btn" id="exportNotes">Експорт нотаток</button>
    <button class="btn primary" id="closeSettings">Готово</button>
  </div>
  <div class="hint" style="margin-top:14px">Версія <span id="verLabel"></span> · дані не залишають пристрій, окрім явних запитів до обраного провайдера.</div>
</div></dialog>

<script type="module">
/* ────────────────────────── CORE:BEGIN (вбудовано build.mjs із src/core.js) */
__CORE__
/* ────────────────────────── CORE:END */

const $ = (id) => document.getElementById(id);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const SETTINGS_KEY = "pocket-agent.settings.v1";

const state = {
  notes: LS.get(NOTES_KEY, []),
  settings: Object.assign(
    { prefer: "auto", provider: "anthropic", model: DEFAULT_CLOUD_MODEL, updateUrl: "", baseUrl: "", ram: "",
      backupProvider: "", backupModel: "", backupBaseUrl: "" },
    LS.get(SETTINGS_KEY, {}),
  ),
  apiKey: "",            // лише в пам'яті сесії, ніколи в localStorage у відкритому вигляді
  backupKey: "",         // ключ запасного провайдера — так само лише в пам'яті
  query: "",
  busy: false,
  queue: LS.get(QUEUE_KEY, []),   // переживає перезапуск: падіння = затримка, не втрата
  health: {},                     // cooldown вузлів ланцюга (лише в пам'яті сесії)
  drainTimer: null,
  draining: false,
  caps: { webgpu: false, secure: false, online: true },
  local: { engine: null, model: null },
};

function toast(msg, ms = 2600) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), ms);
}
const saveNotes = () => { if (!LS.set(NOTES_KEY, state.notes)) toast("Не вдалось зберегти (пам'ять браузера повна)"); };
const saveSettings = () => LS.set(SETTINGS_KEY, state.settings);
const saveQueue = () => { if (!LS.set(QUEUE_KEY, state.queue)) toast("Черга не збереглась (пам'ять браузера повна)"); };

// ── Можливості пристрою ────────────────────────────────────────────────────
async function detectCaps() {
  state.caps.secure = window.isSecureContext === true;
  state.caps.online = navigator.onLine !== false;
  state.caps.webgpu = false;
  if (navigator.gpu && state.caps.secure) {
    try { state.caps.webgpu = !!(await navigator.gpu.requestAdapter()); } catch { state.caps.webgpu = false; }
  }
  renderEngine();
}

function currentEngine() {
  return pickEngine({
    online: state.caps.online,
    hasCloudKey: !!state.apiKey,
    webgpu: state.caps.webgpu,
    secureContext: state.caps.secure,
    prefer: state.settings.prefer,
  });
}

function renderEngine() {
  const e = currentEngine();
  const chip = $("engineChip");
  chip.className = "chip " + e.engine;
  chip.textContent = { cloud: "☁️ хмара", local: "⬇ локальна", offline: "⚡ офлайн" }[e.engine];
  chip.title = `${e.engine}: ${e.reason}`;
  const hint = $("localHint");
  if (hint) {
    hint.textContent = state.caps.webgpu
      ? (state.local.model ? `Завантажено: ${state.local.model}` : "WebGPU доступний — модель ще не завантажено.")
      : (state.caps.secure ? "WebGPU недоступний у цьому браузері." : "Потрібен HTTPS: на file:// та content:// WebGPU і мікрофон вимкнені.");
  }
}

// ── Рендер ─────────────────────────────────────────────────────────────────
const fmtTime = (ts) => new Date(ts).toLocaleString("uk-UA", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function render() {
  const list = $("list");
  const notes = searchNotes(state.notes, state.query);
  if (!notes.length) {
    list.innerHTML = state.query
      ? `<div class="empty"><b>Нічого не знайдено</b>Спробуй інше слово або тег.</div>`
      : `<div class="empty"><b>Порожньо — і це нормально</b>Напиши думку або запитання внизу. Працює навіть без мережі й без ключа:
         офлайн-режим структурує запис. «+» на початку — задача, «знайди …» — пошук.</div>`;
    return;
  }
  list.innerHTML = notes.map((n) => `
    <article class="note ${n.kind === "task" ? "task" : ""}" data-id="${esc(n.id)}">
      <button class="del" data-del="${esc(n.id)}" aria-label="Видалити">✕</button>
      <div class="meta">
        <span class="badge">${n.kind === "task" ? "задача" : "нотатка"}</span>
        <span class="badge">${esc(n.engine || "?")}</span>
        <span>${fmtTime(n.ts)}</span>
      </div>
      <div class="q">${esc(n.input)}</div>
      <div class="a">${esc(n.answer)}</div>
      ${n.tags?.length ? `<div class="tags">${n.tags.map((t) => "#" + esc(t)).join(" ")}</div>` : ""}
    </article>`).join("");
}

// ── Двигуни ────────────────────────────────────────────────────────────────
const SYSTEM_PROMPT =
  "Ти — кишеньковий помічник у телефоні. Відповідай стисло (2–5 речень), українською, " +
  "без вступів і без повторення запитання. Якщо це задача — дай 2–3 конкретні кроки.";

async function runCloud(text, backup = false) {
  const s = state.settings;
  const req = buildCloudRequest({
    provider: backup ? (s.backupProvider || "openai") : s.provider,
    apiKey: backup ? state.backupKey : state.apiKey,
    model: (backup ? s.backupModel : s.model) || DEFAULT_CLOUD_MODEL,
    baseUrl: backup ? s.backupBaseUrl : s.baseUrl,
    system: SYSTEM_PROMPT,
    messages: [{ role: "user", content: text }],
    maxTokens: 800,
  });
  const res = await fetch(req.url, { method: "POST", headers: req.headers, body: JSON.stringify(req.body) });
  if (!res.ok) {
    // Статус і Retry-After несемо в помилці: без них класифікатор збою сліпий
    // і будь-яке падіння виглядало б однаково фатальним.
    const err = new Error(`HTTP ${res.status}: ${redactSecrets((await res.text()).slice(0, 200))}`);
    err.status = res.status;
    err.retryAfter = res.headers.get("retry-after");
    throw err;
  }
  const reply = readCloudReply(backup ? (s.backupProvider || "openai") : s.provider, await res.json());
  if (!reply) throw new Error("Порожня відповідь провайдера");
  return reply;
}

const WEBLLM_CDN = "https://esm.run/@mlc-ai/web-llm@0.2.84";
let webllmLib = null;
async function loadWebllmLib() {
  if (webllmLib) return webllmLib;
  const imp = new Function("u", "return import(u)");   // динамічний імпорт, не чіпаний збіркою
  return (webllmLib = await imp(WEBLLM_CDN));
}

async function ensureLocalModel(onProgress) {
  if (state.local.engine) return state.local.engine;
  if (!state.caps.webgpu) throw new Error("WebGPU недоступний (потрібен HTTPS і сучасний Chrome)");
  const lib = await loadWebllmLib();
  const est = estimateVramMB(state.settings.ram || navigator.deviceMemory, true);
  const models = (lib.prebuiltAppConfig?.model_list || []).map((m) => ({ id: m.model_id, vram: m.vram_required_MB }));
  const best = rankLocalModels(models, est)[0];
  if (!best) throw new Error("Не знайдено придатної моделі");
  state.local.engine = await lib.CreateMLCEngine(best.id, {
    initProgressCallback: (p) => onProgress?.(Math.round((p.progress || 0) * 100), p.text || ""),
  });
  state.local.model = best.id;
  renderEngine();
  return state.local.engine;
}

async function runLocal(text) {
  const engine = await ensureLocalModel((pct, msg) => toast(`Модель ${pct}% ${msg.slice(0, 40)}`, 1500));
  const r = await engine.chat.completions.create({
    messages: [{ role: "system", content: SYSTEM_PROMPT }, { role: "user", content: text }],
    max_tokens: 500, stream: false,
  });
  return String(r.choices?.[0]?.message?.content || "").trim();
}

// ── Головний цикл ──────────────────────────────────────────────────────────
// ── Резервний контур: черга → повтори → ланцюг провайдерів ────────────────
// Було: одна спроба, catch → офлайн-заглушка, робота втрачена. Стало: завдання
// стає в чергу, поле вводу звільняється одразу, а контур сам повторює з паузою
// і перемикає провайдера. Падіння API тепер ЗАТРИМУЄ, а не зупиняє.
async function submit() {
  const raw = $("input").value;
  const cmd = parseCommand(raw);
  if (!cmd.payload && cmd.kind !== "search") return;

  if (cmd.kind === "search") {
    state.query = cmd.payload;
    $("search").value = cmd.payload;
    $("input").value = "";
    render();
    return;
  }

  state.queue.push(makeTask({ input: cmd.payload, kind: cmd.kind }));
  saveQueue();
  $("input").value = ""; $("input").style.height = "auto";
  state.query = ""; $("search").value = "";
  render(); renderQueue();
  drainQueue();
}

/** Виконати одне завдання конкретним вузлом ланцюга. */
async function runNode(node, task) {
  if (node.kind === "cloud") return runCloud(task.input, !!node.backup);
  if (node.kind === "local") return runLocal(task.input);
  return offlineAnswer(task.input, task.kind);
}

/** Можливості, за якими ланцюг вирішує, що зараз узагалі доступне. */
function chainCaps() {
  return {
    online: navigator.onLine !== false,
    hasCloudKey: !!state.apiKey,
    hasBackupKey: !!state.backupKey,
    localReady: !!state.local.engine || (state.caps.webgpu && state.settings.prefer !== "offline"),
  };
}

/**
 * Спорожнення черги. Один прохід = одне завдання, далі перепланування:
 * так UI лишається живим, а паузи між спробами дотримуються точно.
 */
async function drainQueue() {
  if (state.draining) return;
  const task = nextRunnable(state.queue, Date.now());
  if (!task) { renderQueue(); scheduleDrain(); return; }

  state.draining = true;
  renderQueue();
  const caps = chainCaps();
  // Офлайн-відповідь — свідомий компроміс, а не автоматичний: беремо її лише
  // на останній спробі, за явним вибором користувача, або коли інших вузлів нема.
  const lastChance = task.attempts + 1 >= MAX_ATTEMPTS;
  const nothingElse = !caps.hasCloudKey && !caps.hasBackupKey && !caps.localReady;
  const allowOffline = lastChance || nothingElse;
  const chain = defaultChain(state.settings);
  const tried = [];
  let failure = null, lastErr = "", node = null;

  try {
    // Обхід ланцюга В МЕЖАХ ОДНОГО ПРОХОДУ: якщо провайдер відмовив так, що
    // перемикання має сенс (ліміт, чужий ключ, 503) — наступний вузол пробуємо
    // НЕГАЙНО, без паузи. Пауза потрібна лише коли весь ланцюг відмовив.
    while (true) {
      node = state.settings.prefer === "offline"
        ? { id: "offline", kind: "offline" }
        : pickProvider(chain, { health: state.health, caps, tried, allowOffline });
      if (!node) break;
      tried.push(node.id);
      try {
        const answer = await runNode(node, task);
        state.health = markSuccess(state.health, node.id);
        state.queue = applyOutcome(state.queue, task.id, { ok: true, answer, engine: node.id, tried });
        state.notes.unshift(makeNote({ input: task.input, answer, engine: node.id, kind: task.kind }));
        saveNotes();
        failure = null;
        break;
      } catch (err) {
        failure = classifyFailure({
          status: err.status, message: err.message, retryAfter: err.retryAfter,
          offline: navigator.onLine === false,
        });
        lastErr = redactSecrets(err.message || String(err));
        state.health = markFailure(state.health, node.id, { kind: failure.kind, retryAfterMs: failure.retryAfterMs });
        if (!failure.switchProvider) break;   // наступний вузол не допоможе
      }
    }

    if (failure || !node) {
      const f = failure || { retryable: true, switchProvider: false, kind: "cooldown", retryAfterMs: null };
      state.queue = applyOutcome(state.queue, task.id, {
        ok: false, failure: f, engine: node?.id, tried, error: lastErr || "усі провайдери на паузі",
      });
      const after = state.queue.find((x) => x.id === task.id);
      if (after?.status === "failed") {
        // Вичерпано ланцюг: чесний офлайн-запис + завдання лишається видимим
        // і придатним до ручного повтору. Мовчазної втрати не буває.
        state.notes.unshift(makeNote({
          input: task.input, kind: task.kind, engine: "offline",
          answer: offlineAnswer(task.input, task.kind) + `\n\n⚠️ Провайдери недоступні (${f.kind}). Запис збережено офлайн; повтор — кнопкою в черзі.`,
        }));
        saveNotes();
        notifyFailure(after);
      }
    }
  } finally {
    state.draining = false;
    saveQueue();
    render(); renderQueue(); renderEngine();
  }
  scheduleDrain();
}

/** Наступний прохід — рівно тоді, коли настане час найранішої спроби. */
function scheduleDrain() {
  clearTimeout(state.drainTimer);
  const pending = state.queue.filter((t) => t.status === "pending");
  if (!pending.length) return;
  const now = Date.now();
  const soonest = Math.min(...pending.map((t) => t.nextAttemptAt));
  state.drainTimer = setTimeout(drainQueue, Math.max(0, Math.min(soonest - now, 60000)) + 20);
}

/** Сповіщення про збій: банер завжди, системне — лише коли застосунок згорнуто. */
function notifyFailure(task) {
  toast("Завдання не вдалося — доступний ручний повтор");
  if (document.visibilityState === "hidden" && window.Notification?.permission === "granted") {
    try {
      new Notification("Кишеньковий агент", {
        body: `Не вдалося виконати: ${task.input.slice(0, 60)}`,
        tag: "pocket-agent-failure",
      });
    } catch {}
  }
}

/** Видимий стан черги: скільки чекає, коли наступна спроба, що впало. */
function renderQueue() {
  const box = $("queue");
  const s = queueSummary(state.queue, Date.now());
  const active = state.queue.filter((t) => t.status === "pending" || t.status === "failed");
  $("queueStatus").textContent = state.draining && !s.text ? "виконується…" : s.text;
  $("queueStatus").className = "qstatus" + (s.needsAttention ? " err" : "");
  box.className = active.length ? "queuebox on" : "queuebox";
  box.innerHTML = active.map((t) => `
    <div class="qitem ${t.status}">
      <span class="qtext">${esc(t.input.slice(0, 70))}</span>
      <span class="qmeta">${t.status === "failed" ? "не вдалося" : `спроба ${t.attempts + 1}`}</span>
      ${t.status === "failed" ? `<button class="qretry" data-retry="${esc(t.id)}">Повторити</button>` : ""}
    </div>`).join("");
}

// ── Голос ──────────────────────────────────────────────────────────────────
function setupVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = $("mic");
  if (!SR || !window.isSecureContext) {
    btn.disabled = true;
    btn.title = window.isSecureContext ? "Браузер не підтримує розпізнавання мовлення" : "Потрібен HTTPS";
    btn.style.opacity = ".4";
    return;
  }
  const rec = new SR();
  rec.lang = "uk-UA"; rec.interimResults = false; rec.maxAlternatives = 1;
  let on = false;
  btn.onclick = () => { on ? rec.stop() : rec.start(); };
  rec.onstart = () => { on = true; btn.textContent = "⏺"; };
  rec.onend = () => { on = false; btn.textContent = "🎤"; };
  rec.onerror = (e) => { on = false; btn.textContent = "🎤"; toast("Мікрофон: " + e.error); };
  rec.onresult = (e) => {
    const t = e.results[0][0].transcript;
    $("input").value = ($("input").value ? $("input").value + " " : "") + t;
    $("input").focus();
  };
}

// ── Секрети ────────────────────────────────────────────────────────────────
async function saveKey() {
  const key = $("apikey").value.trim(), pass = $("passphrase").value;
  const backup = $("backupApikey").value.trim();
  if ((!key && !backup) || !pass) return toast("Потрібні ключ і пароль-фраза");
  try {
    if (key) { LS.set(SECRET_KEY, await encryptSecret(key, pass)); state.apiKey = key; }
    if (backup) { LS.set(SECRET_KEY + ".backup", await encryptSecret(backup, pass)); state.backupKey = backup; }
    $("apikey").value = ""; $("backupApikey").value = ""; $("passphrase").value = "";
    $("keyHint").textContent = "Ключ зашифровано й збережено на пристрої.";
    $("keyHint").classList.remove("err");
    toast("Ключ збережено (зашифровано)"); renderEngine();
  } catch (e) { toast("Не вдалось зашифрувати: " + e.message); }
}

async function unlockKey() {
  const env = LS.get(SECRET_KEY, null), pass = $("passphrase").value;
  if (!env) return toast("Збереженого ключа нема");
  if (!pass) return toast("Введи пароль-фразу");
  try {
    state.apiKey = await decryptSecret(env, pass);
    const benv = LS.get(SECRET_KEY + ".backup", null);
    if (benv) { try { state.backupKey = await decryptSecret(benv, pass); } catch { toast("Запасний ключ не відкрився"); } }
    $("passphrase").value = "";
    $("keyHint").textContent = "Ключ відкрито для цієї сесії.";
    $("keyHint").classList.remove("err");
    toast("Ключ відкрито"); renderEngine();
  } catch {
    $("keyHint").textContent = "Хибна пароль-фраза.";
    $("keyHint").classList.add("err");
  }
}

// ── Авто-оновлення ─────────────────────────────────────────────────────────
async function checkUpdate(silent) {
  const url = state.settings.updateUrl;
  if (!url) { if (!silent) toast("Спершу вкажи URL version.json"); return; }
  try {
    const d = await (await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" })).json();
    if (isNewerVersion(d.version, APP_VERSION)) {
      $("bannerText").textContent = `Доступна версія ${d.version}${d.notes ? " — " + d.notes : ""}`;
      $("banner").classList.add("on");
    } else if (!silent) toast(`Актуальна версія (${APP_VERSION})`);
  } catch (e) { if (!silent) toast("Перевірка не вдалась: " + e.message); }
}

async function applyUpdate() {
  if ("caches" in window) { try { await Promise.all((await caches.keys()).map((k) => caches.delete(k))); } catch {} }
  if (navigator.serviceWorker?.getRegistrations) {
    try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch {}
  }
  location.reload();
}

// ── Service worker (офлайн-оболонка) ───────────────────────────────────────
// ВАЖЛИВО (перевірено 2026-07-24): реєстрація SW з blob:-URL браузером ЗАБОРОНЕНА
// («The URL protocol of the script is not supported»), тому «повністю один файл»
// і справжній офлайн одночасно неможливі. Рішення: поруч лежить sw.js (той самий
// origin). Якщо його нема — застосунок працює далі без офлайн-кешу, без помилок.
async function registerSW() {
  const secureOrigin = location.protocol === "https:" || ["localhost", "127.0.0.1"].includes(location.hostname);
  if (!("serviceWorker" in navigator) || !secureOrigin) return;
  try {
    const probe = await fetch("./sw.js", { method: "HEAD", cache: "no-store" });
    if (!probe.ok) return;                       // роздача одним файлом — це нормально
    await navigator.serviceWorker.register("./sw.js");
    await navigator.serviceWorker.ready;
    // Явно кладемо саме цю сторінку в кеш: інакше вона потрапила б туди лише
    // з другого відкриття (перше завантаження відбувається до контролю SW).
    if ("caches" in window) (await caches.open(`pocket-agent-${APP_VERSION}`)).add(location.href).catch(() => {});
  } catch { /* офлайн-режим просто не вмикається */ }
}

// ── Старт ──────────────────────────────────────────────────────────────────
function bindUI() {
  const s = state.settings;
  $("prefer").value = s.prefer; $("provider").value = s.provider;
  $("model").value = s.model; $("updateUrl").value = s.updateUrl; $("ram").value = s.ram;
  $("backupProvider").value = s.backupProvider || ""; $("backupModel").value = s.backupModel || "";
  $("backupBaseUrl").value = s.backupBaseUrl || "";
  $("verLabel").textContent = APP_VERSION;

  $("send").onclick = submit;
  $("input").addEventListener("input", (e) => {
    e.target.style.height = "auto";
    e.target.style.height = Math.min(e.target.scrollHeight, 140) + "px";
  });
  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); }
  });
  $("search").addEventListener("input", (e) => { state.query = e.target.value; render(); });
  $("queue").addEventListener("click", (e) => {
    const id = e.target.dataset?.retry;
    if (!id) return;
    state.queue = requeue(state.queue, id);
    saveQueue(); renderQueue(); drainQueue();
  });
  $("list").addEventListener("click", (e) => {
    const id = e.target.dataset?.del;
    if (!id) return;
    state.notes = state.notes.filter((n) => n.id !== id);
    saveNotes(); render();
  });

  $("openSettings").onclick = () => $("settings").showModal();
  $("closeSettings").onclick = () => {
    // Дозвіл на сповіщення просимо лише за жестом користувача — інакше браузер відмовляє.
    if (window.Notification?.permission === "default") Notification.requestPermission().catch(() => {});
    $("settings").close();
  };
  $("engineChip").onclick = () => $("settings").showModal();
  for (const [id, key] of [["prefer", "prefer"], ["provider", "provider"], ["model", "model"], ["updateUrl", "updateUrl"], ["ram", "ram"],
                           ["backupProvider", "backupProvider"], ["backupModel", "backupModel"], ["backupBaseUrl", "backupBaseUrl"]]) {
    $(id).addEventListener("change", (e) => { state.settings[key] = e.target.value.trim?.() ?? e.target.value; saveSettings(); renderEngine(); });
  }
  $("saveKey").onclick = saveKey;
  $("unlockKey").onclick = unlockKey;
  $("forgetKey").onclick = () => {
    LS.del(SECRET_KEY); LS.del(SECRET_KEY + ".backup");
    state.apiKey = ""; state.backupKey = "";
    toast("Ключі видалено з пристрою"); renderEngine();
  };
  $("loadLocal").onclick = () => ensureLocalModel((p, m) => toast(`Модель ${p}% ${m.slice(0, 40)}`, 1500))
    .then(() => toast("Локальна модель готова")).catch((e) => toast("Локальна модель: " + e.message));
  $("checkUpdate").onclick = () => checkUpdate(false);
  $("applyUpdate").onclick = applyUpdate;
  $("exportNotes").onclick = () => {
    const blob = new Blob([JSON.stringify(state.notes, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "pocket-agent-notes.json"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  window.addEventListener("online", () => {
    // Мережа повернулась — не чекаємо таймера, пробуємо негайно.
    state.caps.online = true; state.health = {}; renderEngine(); drainQueue();
  });
  window.addEventListener("offline", () => { state.caps.online = false; renderEngine(); });
}

bindUI();
render();
renderQueue();
// Головне для «падіння лише затримає»: незавершені завдання переживають
// перезапуск застосунку й підхоплюються самі.
drainQueue();
setupVoice();
registerSW();
detectCaps();
if (LS.get(SECRET_KEY, null)) $("keyHint").textContent = "Ключ збережено зашифрованим — введи пароль-фразу і натисни «Відкрити».";
if (state.settings.updateUrl) checkUpdate(true);

// Налагоджувальний доступ (він же — точка входу для браузерних тестів).
window.PocketAgent = {
  version: APP_VERSION, state, render, submit, currentEngine,
  core: { pickEngine, parseCommand, searchNotes, offlineAnswer, makeNote, extractTags, isNewerVersion, encryptSecret, decryptSecret,
          classifyFailure, nextBackoffMs, defaultChain, pickProvider, makeTask, nextRunnable, applyOutcome, requeue, queueSummary },
  queue: { drain: drainQueue, summary: () => queueSummary(state.queue, Date.now()) },
};
</script>
