# Залежності / Dependencies: рев'ю залежностей у PR / dependency review on PRs.
name: Dependencies

on:
  pull_request:

# Скасовуємо застарілі прогони того ж ref / cancel superseded runs of the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
