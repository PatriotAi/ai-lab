# Залежності / Dependencies: рев'ю залежностей у PR / dependency review on PRs.
name: Dependencies

on:
  pull_request:

# Скасовуємо застарілі прогони того ж ref / cancel superseded runs of the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Не блокує, поки в repo Settings → Security не ввімкнено Dependency graph
    # (після ввімкнення — прибрати continue-on-error) / non-blocking until the
    # Dependency graph is enabled in repo settings; remove afterwards.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
