# Безпека / Security: секрети, вразливості, SAST / secrets, vulns, SAST.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # щопонеділка / every Monday 06:00 UTC
  workflow_dispatch:

# Скасовуємо застарілі прогони того ж ref / cancel superseded runs of the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action на pull_request читає коміти PR через API / reads PR commits via API
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Vulnerabilities & misconfig (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Trivy filesystem scan
        # v0.36.0 — теги до 0.35.0 уражені supply-chain-інцидентом / tags before 0.35.0 affected by the supply-chain incident
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: security/trivy.yaml
          format: sarif
          output: trivy-results.sarif
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      # W-38: звіт сам по собі нічого не зупиняє — джоб падає на знахідках рівня error
      # (Trivy: HIGH/CRITICAL, Semgrep: ERROR); звіт уже завантажено кроком вище.
      - name: Серйозні знахідки валять перевірку / Fail on error-level findings
        run: python3 scripts/sarif-gate.py trivy-results.sarif

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Не "3.x": колесо semgrep 1.183.0 заявляє лише cp310–cp314, а "3.x" з
          # листопада 2026 дає 3.15 — на ньому semgrep-core падав (exit -11) і скан
          # мовчки не відбувався (W-38). Підняти разом із версією semgrep.
          python-version: "3.14"
      - run: pip install semgrep==1.183.0
      - name: Semgrep scan
        run: semgrep scan --config p/security-audit --config p/secrets --sarif --output semgrep.sarif
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      # W-38: звіт сам по собі нічого не зупиняє — джоб падає на знахідках рівня error
      # (Trivy: HIGH/CRITICAL, Semgrep: ERROR); звіт уже завантажено кроком вище.
      - name: Серйозні знахідки валять перевірку / Fail on error-level findings
        run: python3 scripts/sarif-gate.py semgrep.sarif
