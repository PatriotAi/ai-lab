# Якість коду / Code quality: pre-commit + actionlint.
name: Code quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Скасовуємо застарілі прогони того ж ref / cancel superseded runs of the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1
        with:
          reporter: github-pr-check
          fail_level: error

  automations:
    name: automations tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # weekly-digest читає git log --since / full history
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4          # секція 6: тести projects/mobile-agent
        with:
          node-version: "22"
      - name: Регресійні тести автоматизацій / automations regression tests
        run: bash tests/run-tests.sh
      # Гейти екосистеми (цілісність MANIFEST, guard, anti-stale, доказовість тверджень)
      # доти блокували лише локально — на PR вони не запускались узагалі.
      - name: Гейт екосистеми melania / melania ecosystem gate
        run: python3 melania-skills-ecosystem/scripts/maintain.py verify
