# ЄДИНЕ місце, де описано «яка дія → який рівень ризику → що з нею робити».
#
# ЯК ЦЕ ЧИТАТИ, ЯКЩО ТИ НЕ ПРОГРАМІСТ
# -----------------------------------
# Кожна дія агента отримує один із п'яти рівнів. Що вищий рівень — то більше
# перевірок вмикається. Читання не перевіряється взагалі (бо нічого не змінює),
# незворотне — блокується й питає тебе.
#
#   R0  читання              нічого не змінює          → без перевірок
#   R1  локальний запис      файл у цьому репозиторії  → швидкі перевірки
#   R2  виконання команди    може мати наслідки        → перевірка команди
#   R3  недовірений вхід     текст іззовні в контекст  → скан на ін'єкцію
#   R4  незворотне/назовні   не відкотиш або видно     → блок + твоя згода
#
# Змінити поведінку = змінити цей файл. Код чіпати не треба.

[meta]
version = "1.2.0"
updated = "2026-07-27"

# ─────────────────────────────────────────────────────────────────────────────
# ТЕКИ, ЯКИМИ КЕРУЄ САМ ІНСТРУМЕНТ
# Запис сюди — звичайна робота Claude Code (файли планів, тимчасові файли),
# а не вихід за межі проєкту. Без цього переліку правило «поза репо → R4»
# блокувало навіть файл плану — тобто робило режим планування непрацездатним
# (спіймано 2026-07-27, третя хибна тривога поспіль).
#
# Чому це НЕ послаблення: перелік вузький і явний. Будь-яка інша тека поза
# репозиторієм лишається R4. Перевірка, що заважає легітимній роботі, вчить
# себе обходити — а обхід не лишає сліду, на відміну від блоку.
# ─────────────────────────────────────────────────────────────────────────────
[workspace]
tool_managed_paths = [
  "/root/.claude/plans/*",
  "/root/.claude/todos/*",
  "/tmp/claude-*",
]

# ─────────────────────────────────────────────────────────────────────────────
# РІВЕНЬ R0 — читання. Нічого не змінює, тому не перевіряється взагалі.
# Це і є економія: переважна більшість дій сюди й потрапляє.
# ─────────────────────────────────────────────────────────────────────────────
[levels.R0]
tools = ["Read", "Glob", "Grep", "NotebookRead", "TaskList", "TaskGet", "TodoWrite"]
# Команди читання: якщо команда починається з цього — вона R0.
bash_prefixes = [
  "git status", "git log", "git diff", "git branch", "git show", "git remote -v",
  "ls", "cat", "head", "tail", "wc", "find", "grep", "rg", "pwd", "which", "echo",
]

# ─────────────────────────────────────────────────────────────────────────────
# РІВЕНЬ R1 — локальний запис у межах репозиторію.
# ─────────────────────────────────────────────────────────────────────────────
[levels.R1]
tools = ["Write", "Edit", "NotebookEdit"]

# ─────────────────────────────────────────────────────────────────────────────
# РІВЕНЬ R3 — недовірений вхід. Не виконує дію, але ЗМІНЮЄ подальші рішення.
# Найтихіший клас: нічого не ламається зараз, ламається згодом.
# ─────────────────────────────────────────────────────────────────────────────
[levels.R3]
tools = ["WebFetch", "WebSearch"]
# Файли, вміст яких потрапляє в контекст сесії автоматично.
# Пам'ять G5 — саме цей випадок (дефект F-1).
memory_paths = [
  "experiments/gmi-g5-auto/g5-package.md",
  "experiments/gmi-g5-memory/g5-package.md",
]
# Пакет, старший за стільки днів, подається з поміткою «застаріле».
stale_after_days = 30

# ─────────────────────────────────────────────────────────────────────────────
# РІВЕНЬ R4 — незворотне або назовні. БЛОКУЄТЬСЯ, доки власник не погодиться.
# Джерело переліку — docs/external-proposals-protocol.md §5.
# ─────────────────────────────────────────────────────────────────────────────

# Шляхи, запис у які завжди R4. Підтримується `*` як «будь-що».
[[rules]]
id = "workflows"
match_paths = [".github/workflows/*", ".github/actions/*"]
level = "R4"
why = "Це файли, які керують автоматичними перевірками на GitHub. Зміна тут може непомітно вимкнути захист усього репозиторію."
alternatives = "Опиши, що саме треба змінити у перевірках — і схвали зміну свідомо, побачивши її."

[[rules]]
id = "agent-settings"
match_paths = [".claude/settings.json", ".claude/settings.local.json", "security/policy.toml"]
level = "R4"
why = "Це налаштування самого агента й цього безпекового пакета. Якщо агент може змінювати власні межі, межі перестають бути межами."
alternatives = "Зміна можлива — але лише як окрема свідома правка, яку ти бачиш і схвалюєш."

[[rules]]
id = "secrets"
match_paths = [".env", ".env.*", "*.key", "*.pem", "secrets/*", "*id_rsa*", "*.p12"]
level = "R4"
why = "Тут живуть ключі й паролі. Будь-яка робота з ними — найчутливіше, що є: витік ключа не відкотиш."
alternatives = "Ключі задаються змінними оточення поза репозиторієм. Якщо треба новий ключ — створи його сам, я його не бачу і не зберігаю."

# Команди, що завжди R4. Це підрядки: якщо трапляються в команді — спрацьовує.
[[rules]]
id = "force-push"
match_commands = ["push --force", "push -f", "push origin +"]
# ВИНЯТОК: `--force-with-lease` — це саме та безпечна форма, яку радить рядок
# `alternatives` нижче. Без винятку правило блокувало б рекомендовану дію й
# підштовхувало до небезпечної (спіймано канаркою 2026-07-27).
except_commands = ["--force-with-lease"]
level = "R4"
why = "Примусовий пуш ПЕРЕЗАПИСУЄ історію на сервері. Якщо там були чужі коміти або твоя робота з іншої сесії — вони зникнуть без сліду."
alternatives = "Безпечний варіант — `--force-with-lease`: він теж перезаписує, але СПОЧАТКУ перевіряє, що ніхто інший нічого не додав, і відмовляється, якщо додав."

[[rules]]
id = "skip-verification"
match_commands = ["--no-verify", "--no-gpg-sign", "SKIP=", "commit -n "]
level = "R4"
why = "Це прапорці, що ВИМИКАЮТЬ перевірки перед комітом. Саме так у репозиторій потрапляють секрети — перевірка, яку обійшли, не спрацює."
alternatives = "Якщо перевірка заважає — краще полагодити її або тимчасово вимкнути свідомо, ніж обходити мовчки."

[[rules]]
id = "merge-to-main"
match_commands = ["merge_pull_request", "pr merge", "git merge main", "git push origin main"]
level = "R4"
why = "Злиття в `main` — це рішення «ця робота тепер канонічна». Її отримають усі інші сесії. Правило лабораторії: злиття — лише за твоєю явною згодою."
alternatives = "Спершу подивись, що саме зміниться. Гілка нікуди не дінеться — вона чекатиме, скільки треба."

[[rules]]
id = "destructive-delete"
match_commands = ["rm -rf", "rm -fr", "git clean -fdx", "filter-repo", "filter-branch", "DROP TABLE", "git reset --hard origin"]
level = "R4"
why = "Це видалення без кошика. Файли, які не закомічені, після цього не відновлюються нічим."
alternatives = "Майже завжди достатньо видалити конкретний файл або зробити коміт перед прибиранням."

[[rules]]
id = "remote-code-execution"
match_commands = ["curl", "wget", "| sh", "| bash", "npm install -g", "pip install"]
level = "R4"
why = "Це завантаження й запуск коду з інтернету. Такий код виконується з твоїми правами — і його ніхто не перевіряв."
alternatives = "Якщо потрібен інструмент — назви його, і ми поставимо його свідомо, звіривши джерело."

[[rules]]
id = "publish-outward"
match_commands = ["gh release", "vercel deploy", "npm publish", "gh repo edit --visibility"]
level = "R4"
why = "Це публікація назовні. Опубліковане може бути збережене й проіндексоване іншими — навіть якщо потім видалити."
alternatives = "Прев'ю та чернетки не потребують публікації. Публікуємо лише те, що ти справді хочеш показати."

# ─────────────────────────────────────────────────────────────────────────────
# ЩО РОБИТИ ПРИ СПРАЦЮВАННІ
# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
# САМОЗМІНА ГЕЙТА — записується гучно, але НЕ блокується.
#
# Рішення власника 2026-07-27. Обґрунтування: блок тут дав би ілюзію бар'єра.
# Агент, якого блокують, однаково може виписати собі згоду в `consent.md` —
# отже «захист» коштував би тертя при кожному калібруванні, не додавши безпеки.
# Натомість кожна правка власного гейта лишає слід у журналі й у звіті дрейфу.
#
# Справжнє закриття цієї діри — ПОЗА агентом: захист гілок, обов'язковий рев'ю,
# підписані коміти. Так і написано в `docs/security/threat-model.md` §5.
# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
# MCP-ІНСТРУМЕНТИ (GitHub, Vercel, Canva, Slack, Notion…)
#
# НАВІЩО. До 2026-07-27 гейт бачив лише команди оболонки й правки файлів.
# MCP-інструменти проходили як «невідомий клас» = R2, тобто без питань.
# Перевірено ділом одразу після злиття PR #48: `merge_pull_request` — незворотне
# злиття в `main` — пройшло БЕЗШУМНО, а тестова команда, що лише ЗГАДУВАЛА його
# назву, була заблокована. Прикриті вони були випадково: спрацьовувало правило
# шляхів, якщо інструмент мав поле `path`.
#
# Класифікація за ДІЄСЛОВОМ у назві. Це свідомо груба, але передбачувана схема:
# назви MCP-інструментів конвенційні (`get_`, `list_`, `create_`, `delete_`).
# Невідоме дієслово → R2, а не R0: незнайоме не вважається безпечним.
# ─────────────────────────────────────────────────────────────────────────────
[mcp]
# Читання: нічого не змінюють.
read_verbs = [
  "get_", "list_", "search_", "read_", "fetch_", "view_", "check_",
  "whoami", "_read", "_list", "_get", "_search",
]
# Незворотне або назовні: блокуються нарівні з `git push --force`.
irreversible_verbs = [
  "merge_", "delete_", "remove_", "deploy_", "publish_", "release_",
  "send_", "post_", "buy_", "purchase_", "transfer_", "archive_",
  "force_", "revert_", "close_", "disable_", "enable_", "_merge",
]
# Винятки: назва виглядає незворотною, але дія спрямована ВСЕРЕДИНУ сесії
# й скасовується. Без них правило `send_` ловило `send_later` — планування
# повідомлення САМОМУ СОБІ, яке знімається одним `delete_trigger`
# (спіймано 2026-07-27, наступного ж дня після введення правила).
# Виняток — точний збіг суфікса назви, не підрядок: інакше він сам став би
# дірою, через яку проходило б `slack_send_message`.
except_tools = [
  "send_later",        # нагадування собі в цю ж сесію
  "delete_trigger",    # скасування власного нагадування — це відкат, не втрата
  "close_conversation",
]
why = "Це дія зовнішнім сервісом: злиття, видалення, публікація, деплой або надсилання. Її не відкотиш звичайним способом, і її результат бачать інші люди чи системи."
alternatives = "Майже завжди є оборотний крок поруч: чернетка замість публікації, прев'ю замість деплою, коментар замість злиття. Скажи, чого саме треба досягти — виберемо оборотний шлях."

[self_watch]
paths = [
  "security/spine/*",
  "security/hooks/*",
  "security/policy.toml",
  "security/consent.md",
]

[behaviour]
# "deny" — заблокувати й пояснити (обрано власником 2026-07-27)
# "ask"  — запитати підтвердження
# "warn" — лише попередити, не блокувати
on_R4 = "deny"
# Скільки максимум пояснювати простими словами (рядків).
explain_lines = 12
# Чи розрізати симлінки перед показом шляху (атака GhostApproval).
resolve_symlinks = true
# Якщо гейт сам зламався — що робити. "ask" безпечніше за "allow".
on_internal_error = "ask"
